<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A22"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0D2E"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <ellipse cx="260" cy="240" rx="200" ry="180" fill="url(#glowGrad)"/>
  <!-- Desk -->
  <rect x="80" y="320" width="360" height="12" rx="4" fill="url(#deskGrad)" stroke="#2A2A35" stroke-width="1"/>
  <rect x="100" y="332" width="8" height="80" rx="2" fill="#1A1A22"/>
  <rect x="412" y="332" width="8" height="80" rx="2" fill="#1A1A22"/>
  <!-- Monitor -->
  <rect x="180" y="180" width="200" height="140" rx="8" fill="#0A0A0F" stroke="#2A2A35" stroke-width="2"/>
  <rect x="190" y="190" width="180" height="115" rx="4" fill="url(#screenGrad)"/>
  <!-- Code lines on screen -->
  <rect x="200" y="205" width="60" height="4" rx="2" fill="#8B5CF6" opacity="0.8"/>
  <rect x="200" y="218" width="100" height="4" rx="2" fill="#6366F1" opacity="0.6"/>
  <rect x="200" y="231" width="80" height="4" rx="2" fill="#A78BFA" opacity="0.5"/>
  <rect x="200" y="244" width="120" height="4" rx="2" fill="#8B5CF6" opacity="0.4"/>
  <rect x="200" y="257" width="50" height="4" rx="2" fill="#6366F1" opacity="0.6"/>
  <rect x="200" y="270" width="90" height="4" rx="2" fill="#A78BFA" opacity="0.5"/>
  <rect x="200" y="283" width="70" height="4" rx="2" fill="#8B5CF6" opacity="0.4"/>
  <!-- Monitor stand -->
  <rect x="265" y="320" width="30" height="8" rx="2" fill="#2A2A35"/>
  <!-- Character body -->
  <ellipse cx="260" cy="290" rx="35" ry="25" fill="#8B5CF6" opacity="0.9"/>
  <!-- Character head -->
  <circle cx="260" cy="250" r="28" fill="#C4B5FD"/>
  <!-- Hair -->
  <path d="M232 240 Q260 215 288 240" fill="#7C3AED"/>
  <!-- Eyes -->
  <circle cx="250" cy="248" r="3" fill="#0B0B0F"/>
  <circle cx="270" cy="248" r="3" fill="#0B0B0F"/>
  <!-- Arms -->
  <rect x="220" y="285" width="30" height="8" rx="4" fill="#A78BFA" transform="rotate(-15 235 289)"/>
  <rect x="290" y="285" width="30" height="8" rx="4" fill="#A78BFA" transform="rotate(15 305 289)"/>
  <!-- Chair -->
  <rect x="230" y="340" width="60" height="50" rx="8" fill="#141419" stroke="#2A2A35" stroke-width="1"/>
  <rect x="240" y="390" width="40" height="6" rx="2" fill="#2A2A35"/>
  <!-- Keyboard -->
  <rect x="210" y="310" width="80" height="8" rx="2" fill="#1A1A22" stroke="#2A2A35"/>
  <!-- Mouse -->
  <ellipse cx="310" cy="314" rx="8" ry="5" fill="#2A2A35"/>
  <!-- Plant -->
  <rect x="420" y="300" width="6" height="20" fill="#2A2A35"/>
  <ellipse cx="423" cy="295" rx="15" ry="12" fill="#22C55E" opacity="0.7"/>
  <ellipse cx="430" cy="290" rx="12" ry="10" fill="#16A34A" opacity="0.6"/>
</svg>
